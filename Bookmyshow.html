<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow</title>
    <link rel="stylesheet" href="./Bookmyshow.css">
</head>
<body>

    <!-- header -->
    <header>
        <div class="Container">
            <!-- firstline -->
            <div class="card1">
                <div class="BookMyShow"><h1>BookMyShow</h1></div>
                <div class="Menu">Movies</div>
                <div class="Menu">Events</div>
                <div class="Menu">Sports</div>
                <div class="Menu">More</div>
            </div>

            <!-- secondline -->
            <div class="card2">
                <div class="Menu2"><input type="text" placeholder="search for movies events and sports....." class="input"></div>
                <div class="Menu2"><button>Search</button></div>
            </div>
        </div>
    </header>


    <!-- main section -->
    <main>
        <!-- hero Section  -->
        <div class="hero">
            <h2>Experience the Best Movies and Events</h2>
            <button>Book Now</button>
        </div>

        <!-- popular movies -->
        <div class="popular"><h1>Popular Movies</h1></div>

        <!-- movies card -->
        <div class="movies">

            <!-- Singham -->
            <div class="card">
                <img src="../photos/Singham.avif" alt="singham" class="image">
                <h3>Singham</h3>
            </div>


            <!-- bhool bulaiya -->
            <div class="card">
                <img src="../photos/bhool.avif" alt="Bhool Bhulaiyaa" class="image">
                <h3>Bhool Bhulaiyaa</h3>
            </div>


            <!-- venom -->
            <div class="card">
                <img src="../photos/venom.avif" alt="venom" class="image">
                <h3>Venom</h3>
            </div>


            <!-- vicky vidya -->
            <div class="card">
                <img src="../photos/vicky.avif" alt="Vicky Vidya ka vo wala video" class="image">
                <h3>Vicky Vidya Ka Vo Wala Video</h3>
            </div>

            <!-- Jigra -->
            <div class="card">
                <img src="../photos/jigra.avif" alt="Jigra" class="image">
                <h3>Jigra</h3>
            </div>

            <!-- Chaudhray -->
            <div class="card">
                <img src="../photos/chaudhary.avif" alt="Chaudhray" class="image">
                <h3>Chaudhary</h3>
            </div>

            <!-- Amaran -->
             <div class="card">
                <img src="../photos/amaran.avif" alt="Amaran" class="image">
                <h3>Amaran</h3>
            </div>

            <!-- Wild Robot -->
             <div class="card">
                <img src="../photos/robot.avif" alt=" WildRobot" class="image">
                <h3>Wild Robot</h3>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="bottom">
            <img src="../photos/bottom.avif" alt="Bottom" class="image1">
        </div>

    </footer>



</body>
</html>
